<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" fill="none" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#09090B"/><text x="600" y="80" fill="#FFF" font-family="Inter, sans-serif" font-size="32" font-weight="700" text-anchor="middle">API Key vs JWT</text><text x="600" y="115" fill="#71717A" font-family="Inter, sans-serif" font-size="18" text-anchor="middle">Comparison of Authentication Mechanisms</text><rect width="400" height="350" x="150" y="200" fill="#18181B" stroke="#Amber" stroke-width="2" rx="20" style="stroke:#d97706"/><text x="350" y="240" fill="#F59E0B" font-family="Inter, sans-serif" font-size="22" font-weight="700" text-anchor="middle">API Key</text><text x="350" y="280" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">Machine-to-Machine Auth</text><rect width="300" height="180" x="200" y="320" fill="#27272A" rx="12"/><text x="220" y="350" fill="#FFF" font-family="monospace" font-size="12">tk_live_abcdef123456...</text><text x="220" y="380" fill="#71717A" font-family="Inter, sans-serif" font-size="12">• Long-lived identifier</text><text x="220" y="405" fill="#71717A" font-family="Inter, sans-serif" font-size="12">• Server-side validation</text><text x="220" y="430" fill="#71717A" font-family="Inter, sans-serif" font-size="12">• Perfect for programmatic access</text><text x="220" y="455" fill="#71717A" font-family="Inter, sans-serif" font-size="12">• Identity of the Application</text><rect width="400" height="350" x="650" y="200" fill="#18181B" stroke="#3B82F6" stroke-width="2" rx="20"/><text x="850" y="240" fill="#3B82F6" font-family="Inter, sans-serif" font-size="22" font-weight="700" text-anchor="middle">JWT</text><text x="850" y="280" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">User-to-Machine Auth</text><rect width="300" height="180" x="700" y="320" fill="#27272A" rx="12"/><text x="720" y="350" fill="#FFF" font-family="monospace" font-size="12">eyJhbGciOiJIUzI1NiIs...</text><text x="720" y="380" fill="#71717A" font-family="Inter, sans-serif" font-size="12">• Short-lived token</text><text x="720" y="405" fill="#71717A" font-family="Inter, sans-serif" font-size="12">• Stateless validation</text><text x="720" y="430" fill="#71717A" font-family="Inter, sans-serif" font-size="12">• Context &amp; Claims embedded</text><text x="720" y="455" fill="#71717A" font-family="Inter, sans-serif" font-size="12">• Identity of the User</text><text x="600" y="600" fill="#71717A" font-family="Inter, sans-serif" font-size="16" text-anchor="middle">Use API Keys for software integrations, JWT for user sessions.</text></svg>