<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" fill="none" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#09090B"/><text x="600" y="80" fill="#FFF" font-family="Inter, sans-serif" font-size="32" font-weight="700" text-anchor="middle">JWT Authentication Flow</text><text x="600" y="120" fill="#71717A" font-family="Inter, sans-serif" font-size="18" text-anchor="middle">The request-response lifecycle of JSON Web Tokens</text><path stroke="#27272A" stroke-dasharray="10 10" stroke-width="2" d="M200 337.5H1000"/><rect width="200" height="200" x="50" y="237.5" fill="#18181B" stroke="#3F3F46" stroke-width="2" rx="20"/><text x="150" y="460" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="18" font-weight="500" text-anchor="middle">1. Client Request</text><text x="150" y="320" fill="#FFF" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">POST /auth/login</text><rect width="100" height="40" x="100" y="340" fill="#27272A" rx="8"/><text x="150" y="365" fill="#71717A" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Credentials</text><rect width="200" height="200" x="350" y="237.5" fill="#18181B" stroke="#3B82F6" stroke-width="2" rx="20"/><text x="450" y="460" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="18" font-weight="500" text-anchor="middle">2. Validation</text><circle cx="450" cy="337.5" r="40" fill="#3B82F6" fill-opacity=".1" stroke="#3B82F6" stroke-width="2"/><path stroke="#3B82F6" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M435 337.5L445 347.5L465 327.5"/><rect width="200" height="200" x="650" y="237.5" fill="#18181B" stroke="#8B5CF6" stroke-width="2" rx="20"/><text x="750" y="460" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="18" font-weight="500" text-anchor="middle">3. Issue JWT</text><rect width="140" height="55" x="680" y="310" fill="#5B21B6" fill-opacity=".1" stroke="#8B5CF6" stroke-width="1" rx="8"/><text x="750" y="345" fill="#DDD6FE" font-family="monospace" font-size="14" text-anchor="middle">header.payload.sig</text><rect width="200" height="200" x="950" y="237.5" fill="#18181B" stroke="#10B981" stroke-width="2" rx="20"/><text x="1050" y="460" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="18" font-weight="500" text-anchor="middle">4. Protected Resource</text><rect width="120" height="25" x="990" y="325" fill="#10B981" fill-opacity=".1" rx="4"/><text x="1050" y="342" fill="#10B981" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Bearer Token</text><path stroke="#3F3F46" stroke-width="2" d="M250 337.5H340M340 337.5L330 327.5M340 337.5L330 347.5"/><path stroke="#3F3F46" stroke-width="2" d="M550 337.5H640M640 337.5L630 327.5M640 337.5L630 347.5"/><path stroke="#3F3F46" stroke-width="2" d="M850 337.5H940M940 337.5L930 327.5M940 337.5L930 347.5"/></svg>