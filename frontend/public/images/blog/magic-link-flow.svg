<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" fill="none" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#09090B"/><text x="600" y="80" fill="#FFF" font-family="Inter, sans-serif" font-size="32" font-weight="700" text-anchor="middle">Magic Link Authentication Flow</text><text x="600" y="115" fill="#71717A" font-family="Inter, sans-serif" font-size="18" text-anchor="middle">Passwordless login via secure email links</text><rect width="180" height="200" x="50" y="250" fill="#18181B" stroke="#27272A" stroke-width="2" rx="16"/><text x="140" y="480" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">1. Enter Email</text><rect width="120" height="24" x="80" y="320" fill="#27272A" rx="4"/><text x="140" y="336" fill="#71717A" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">user@example.com</text><rect width="120" height="24" x="80" y="360" fill="#3B82F6" rx="4"/><text x="140" y="376" fill="#FFF" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Send Link</text><rect width="180" height="200" x="300" y="250" fill="#18181B" stroke="#3B82F6" stroke-width="2" rx="16"/><text x="390" y="480" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">2. Tokenly API</text><path stroke="#3B82F6" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M360 350L390 380L420 320"/><rect width="180" height="200" x="550" y="250" fill="#18181B" stroke="#8B5CF6" stroke-width="2" rx="16"/><text x="640" y="480" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">3. Receive Email</text><rect width="120" height="80" x="580" y="310" fill="#5B21B6" fill-opacity=".1" stroke="#8B5CF6" stroke-width="1" rx="8"/><path stroke="#8B5CF6" stroke-width="1" d="M590 330H690"/><rect width="60" height="15" x="610" y="355" fill="#8B5CF6" rx="4"/><rect width="180" height="200" x="800" y="250" fill="#18181B" stroke="#10B981" stroke-width="2" rx="16"/><text x="890" y="480" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">4. Click &amp; Auth</text><circle cx="890" cy="350" r="30" fill="#064E3B" fill-opacity=".2" stroke="#10B981" stroke-width="1"/><path stroke="#10B981" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M880 350L890 360L910 335"/><rect width="150" height="200" x="1000" y="250" fill="#18181B" stroke="#F59E0B" stroke-width="2" rx="16"/><text x="1075" y="480" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">5. JWT Issued</text><rect width="100" height="30" x="1025" y="335" fill="#78350F" fill-opacity=".2" stroke="#F59E0B" stroke-width="1" rx="4"/><text x="1075" y="354" fill="#F59E0B" font-family="monospace" font-size="10" text-anchor="middle">JWT Token</text><path stroke="#27272A" stroke-width="2" d="M230 350H300"/><path stroke="#27272A" stroke-width="2" d="M480 350H550"/><path stroke="#27272A" stroke-width="2" d="M730 350H800"/><path stroke="#27272A" stroke-width="2" d="M980 350H1000"/></svg>